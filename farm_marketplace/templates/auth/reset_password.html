{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 440px; margin: 2rem auto; border-top: 4px solid #2f855a;">
    <h2 style="margin-top: 0; color: #1a202c;">Create a New Password</h2>
    <p style="color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem;">Choose a new password for your Farm Marketplace account.</p>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
        <label for="password">New Password</label>
        <input type="password" name="password" id="password" placeholder="Enter new password" required>

        <label for="confirm_password">Confirm New Password</label>
        <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm new password" required>

        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem; padding: 0.65rem;">Update Password</button>
    </form>
</div>
{% endblock %}
