{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 440px; margin: 2rem auto; border-top: 4px solid #2f855a;">
    <h2 style="margin-top: 0; color: #1a202c;">Sign In</h2>
    <p style="color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem;">Access your farmer dashboard, manage storefronts, or admin controls.</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" placeholder="Enter username" required autofocus maxlength="80">

        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter password" required>

        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem; padding: 0.65rem;">Sign In</button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #edf2f7; text-align: center; font-size: 0.9rem; color: #718096;">
        <div style="margin-bottom: 0.75rem;">
            <a href="{{ url_for('auth.forgot_password') }}" style="color: #2b6cb0; font-weight: 600; text-decoration: none;">Forgot password?</a>
        </div>
        Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: #2b6cb0; font-weight: 600; text-decoration: none;">Register here</a>
    </div>
</div>
{% endblock %}
