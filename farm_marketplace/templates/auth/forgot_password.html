{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 440px; margin: 2rem auto; border-top: 4px solid #2f855a;">
    <h2 style="margin-top: 0; color: #1a202c;">Reset Password</h2>
    <p style="color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem;">Enter the email address on your account and we will send a reset link.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
        <label for="email">Email Address</label>
        <input type="email" name="email" id="email" placeholder="you@example.com" required autofocus>

        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem; padding: 0.65rem;">Send Reset Link</button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #edf2f7; text-align: center; font-size: 0.9rem; color: #718096;">
        <a href="{{ url_for('auth.login') }}" style="color: #2b6cb0; font-weight: 600; text-decoration: none;">Back to sign in</a>
    </div>
</div>
{% endblock %}
